<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>特别的番茄钟</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="mode-ball" data-phase="IDLE">

  <!-- 悬浮球（72px）：按住任意位置拖动，单击展开面板 -->
  <div id="ball" class="hit" title="单击展开面板 · 按住拖动 · 贴边收起">
    <svg class="ring" width="72" height="72" viewBox="0 0 72 72">
      <circle class="ring-bg" cx="36" cy="36" r="31"/>
      <circle class="ring-fg" id="ringFg" cx="36" cy="36" r="31"
              stroke-dasharray="194.8" stroke-dashoffset="194.8"/>
    </svg>
    <div id="ballCore">
      <div id="ballTime">🍅0</div>
      <div id="ballPhase">待开始</div>
    </div>
    <button id="ballQuick" title="直接开始计时">▶</button>
  </div>

  <!-- 贴边收起：柱形条 -->
  <div id="dockBar" class="hit" title="悬停弹出悬浮球"><span>🍅</span></div>

  <!-- 主界面：16:9 横向卡片，点击悬浮球后在球下方弹出 -->
  <div id="panel" class="hit">
    <div class="panel-header">
      <input id="taskName" placeholder="当前任务…" maxlength="30" spellcheck="false">
      <button id="btnCollapse" title="收起为悬浮球">—</button>
    </div>

    <div class="p-mid">
      <div class="p-time">
        <div class="phase-line">
          <span id="phaseBadge"></span>
          <span id="phaseLabel">准备开始</span>
        </div>
        <div id="bigTime">25:00</div>
        <div class="progress"><div id="progressFill"></div></div>
      </div>
      <div class="p-btns">
        <button id="btnStart">开始</button>
        <button id="btnRestart">重新开始</button>
        <button id="btnCancel">取消</button>
      </div>
    </div>

    <div class="p-sliders">
      <div class="sl-col">
        <div class="sl-head">
          <label for="focusSlider">专注</label>
          <input type="number" id="focusNum" min="5" max="45" step="1" value="25">
          <span class="unit">分</span>
        </div>
        <input type="range" id="focusSlider" min="5" max="45" step="1" value="25">
      </div>
      <div class="sl-col">
        <div class="sl-head">
          <label for="bufferSlider">缓冲</label>
          <input type="number" id="bufferNum" min="0" max="25" step="1" value="10">
          <span class="unit">分</span>
        </div>
        <input type="range" id="bufferSlider" min="0" max="25" step="1" value="10">
      </div>
      <div class="sl-col">
        <div class="sl-head">
          <label for="breakSlider">休息</label>
          <input type="number" id="breakNum" min="1" max="30" step="1" value="5">
          <span class="unit">分</span>
        </div>
        <input type="range" id="breakSlider" min="1" max="30" step="1" value="5">
      </div>
    </div>

    <div class="count-line">
      <span>今日番茄</span>
      <span id="todayCount">🍅 × 0</span>
    </div>
  </div>

  <script src="js/settings.js"></script>
  <script src="js/state.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/ui.js"></script>
</body>
</html>
